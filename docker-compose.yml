version: '3.8'

services:
  app:
    build:
      args:
        user: goldab
        uid: 1000
      context: ./
      dockerfile: Dockerfile
    image: goldab-app-img
    container_name: goldab-app
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    networks:
      - goldab
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: goldab_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - goldab
    depends_on:
      - app
  
  redis:
    image: redis:7.4-alpine
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - goldab

networks:
  goldab:
    driver: bridge

